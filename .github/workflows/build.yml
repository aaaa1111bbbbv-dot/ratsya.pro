name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Cordova APK
        run: |
          npm install -g cordova
          cordova create app com.uztac.ratsya "UZ-TAC Ratsiya"
          rm -rf app/www/*
          cp index.html app/www/
          cd app
          cordova platform add android
          cordova plugin add cordova-plugin-android-permissions
          cordova plugin add https://github.com/EddyVerbruggen/Insomnia-PhoneGap-Plugin.git

          # AndroidManifest.xml ga mikrofon va audio ruxsatlarini majburiy qo'shish
          MANIFEST="platforms/android/app/src/main/AndroidManifest.xml"
          sed -i 's|<application|<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.MICROPHONE" />\n    <application|' $MANIFEST

          cordova build android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UZTAC-Ratsiya-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
